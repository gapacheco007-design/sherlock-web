<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sherlock Finder - Búsqueda de Presencia Digital</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --text: #f8fafc;
            --muted: #94a3b8;
            --success: #4ade80;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 8px;
        }
        header p {
            color: var(--muted);
            font-size: 1rem;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            margin-bottom: 24px;
        }
        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            background: #0b1120;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: var(--primary);
        }
        button {
            padding: 14px 28px;
            background: var(--primary);
            color: #0b1120;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: var(--primary-hover);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .options {
            display: flex;
            gap: 20px;
            color: var(--muted);
            font-size: 0.9rem;
        }
        .options label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .status {
            text-align: center;
            padding: 20px;
            color: var(--muted);
            display: none;
        }
        .spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .results-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 12px;
        }
        .result-item {
            background: #0b1120;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: transform 0.2s, border-color 0.2s;
        }
        .result-item:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
        }
        .result-item .site {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text);
            text-transform: capitalize;
        }
        .result-item a {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.85rem;
            word-break: break-all;
        }
        .result-item a:hover {
            text-decoration: underline;
        }
        .badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(74, 222, 128, 0.15);
            color: var(--success);
            align-self: flex-start;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 12px;
            border-radius: 8px;
            margin-top: 16px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Sherlock Finder</h1>
            <p>Comprueba la presencia pública de un alias o nombre de usuario</p>
        </header>

        <div class="card">
            <form id="searchForm">
                <div class="search-box">
                    <input type="text" id="usernameInput" placeholder="Ej: satoshi, elonmusk, juanperez" required autocomplete="off">
                    <button type="submit" id="searchBtn">Buscar</button>
                </div>
                <div class="options">
                    <label>
                        <input type="radio" name="mode" value="quick" checked>
                        Búsqueda rápida (Redes principales: GitHub, Twitter, Instagram, etc.)
                    </label>
                    <label>
                        <input type="radio" name="mode" value="full">
                        Búsqueda completa (+400 sitios, tarda más)
                    </label>
                </div>
            </form>
            <div id="errorBox" class="alert-error"></div>
        </div>

        <div id="loadingStatus" class="status">
            <div class="spinner"></div>
            <p id="statusText">Consultando plataformas en tiempo real... por favor espera.</p>
        </div>

        <div id="resultsCard" class="card" style="display: none;">
            <div class="results-header">
                <h3>Resultados encontrados</h3>
                <span id="counterBadge" class="badge">0 plataformas</span>
            </div>
            <div id="resultsList" class="results-list"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('searchForm');
        const usernameInput = document.getElementById('usernameInput');
        const searchBtn = document.getElementById('searchBtn');
        const loadingStatus = document.getElementById('loadingStatus');
        const resultsCard = document.getElementById('resultsCard');
        const resultsList = document.getElementById('resultsList');
        const counterBadge = document.getElementById('counterBadge');
        const errorBox = document.getElementById('errorBox');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = usernameInput.value.trim();
            const mode = document.querySelector('input[name="mode"]:checked').value;

            if (!username) return;

            // Limpiar interfaz
            errorBox.style.display = 'none';
            resultsCard.style.display = 'none';
            resultsList.innerHTML = '';
            loadingStatus.style.display = 'block';
            searchBtn.disabled = true;

            try {
                // Se conecta mediante la ruta relativa /api/search que Netlify redirige al VPS
                const response = await fetch(`/api/search?username=${encodeURIComponent(username)}&mode=${mode}`);
                
                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.detail || `Error en la solicitud: ${response.status}`);
                }

                const data = await response.json();
                loadingStatus.style.display = 'none';
                resultsCard.style.display = 'block';
                counterBadge.textContent = `${data.total_found} encontradas`;

                if (data.results.length === 0) {
                    resultsList.innerHTML = '<p style="color: var(--muted); grid-column: 1/-1;">No se encontraron cuentas públicas con ese nombre en las plataformas consultadas.</p>';
                } else {
                    data.results.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'result-item';
                        div.innerHTML = `
                            <span class="site">${item.site}</span>
                            <span class="badge">Cuenta Detectada</span>
                            <a href="${item.url}" target="_blank" rel="noopener noreferrer">${item.url}</a>
                        `;
                        resultsList.appendChild(div);
                    });
                }
            } catch (err) {
                loadingStatus.style.display = 'none';
                errorBox.textContent = `Error: ${err.message}. Comprueba que el backend en tu VPS esté activo y configurado.`;
                errorBox.style.display = 'block';
            } finally {
                searchBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
